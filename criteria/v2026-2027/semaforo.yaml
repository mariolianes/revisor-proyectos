# Semaforo pedagógico. Derivado del §12.1 del Documento Maestro y calibrado
# con el §9 de docs/maestro/04-calibracion.md.
# El semaforo resume el estado; no sustituye la rúbrica, la nota ni la
# explicacion. Un mismo color puede responder a causas diferentes.
#
# El calibrador llama AMARILLO a lo que el Maestro llama AMBAR. Es el mismo
# estado con otro nombre, y manda el Maestro por ser fuente superior (§14.1).
# Decisión del docente, 2026-08-28: se mantiene AMBAR.
#
# 'calibrado' recoge la lectura afinada con la muestra historica. No sustituye
# al significado: lo precisa.
#
# Decisión del docente, 2026-08-31: la escala pasa a cuatro niveles, con una
# regla fronteriza que invierte el criterio de antes -ante la duda, el sistema
# elegía siempre el color más severo-. Tal como la dio:
#
#   «Entre ámbar y verde, usar verde con alertas cuando todos los mínimos
#   estén cumplidos. Entre rojo y ámbar, usar rojo únicamente cuando exista
#   una carencia crítica demostrable. La prudencia no significa elegir
#   siempre el color más bajo.»
#
# La mitad rojo/ámbar ya la cumplía el código: ROJO solo sale de un hallazgo
# P1, y P1 es -en prioridades.yaml, calibracion#7-prioridades- precisamente
# lo que "bloquea o compromete la fase", verificado además contra
# evidencia_localizada. Un P1 fiable ES la carencia crítica demostrable; no
# hay una duda que resolver ahí. En la mitad ámbar/verde, la regla fronteriza
# se aplica SIN un color nuevo: un P3 fiable -"refina, pero no cambia el
# nivel global", la propia definición de prioridades.yaml- deja el proyecto
# en VERDE y levanta una alerta al lado.
#
# Entre el 31 de agosto y el 2 de septiembre existió aquí un quinto código,
# VERDE_CON_ALERTAS. El docente lo cerró en decisiones#12-semaforo: «Verde
# con alertas no será un quinto estado. Se implementará como VERDE
# acompañado por alertas estructuradas o por un indicador complementario.
# Mantener el enum de cuatro estados del Documento Maestro. El calibrador
# puede añadir alertas o matices, pero no crear un color oficial nuevo.» La
# migración que iba a añadirlo a la base se retiró antes de aplicarse.
# Ver docs/changes/2026-09-02-el-semaforo-vuelve-a-cuatro-estados.md.

- codigo: VERDE
  significado: Cumple la fase y puede avanzar
  accion: Mantener fortalezas y aplicar ajustes menores
  calibrado: >-
    Correcto para la fase. Puede contener imprecisiones menores que no impiden
    avanzar ni defender el planteamiento. Cuando conserva algún defecto
    importante por atender -un P3 fiable sin ningún P1 ni P2- sigue siendo
    VERDE y se acompaña de una alerta: es lo que el docente llama "verde con
    alertas", que decidió que no fuera un color propio.
  fuente: maestro#12-errores-y-semaforo
  fuente_calibracion: calibracion#9-semaforo
  fuente_alertas: decisiones#12-semaforo

- codigo: AMBAR
  significado: Avanza, pero existen correcciones prioritarias
  accion: Aplicar cambios antes de cerrar la siguiente fase
  calibrado: >-
    Requiere mejora o seguimiento. El proyecto tiene base, pero necesita
    aplicar prioridades concretas antes de considerarse cerrado.
  llamado_por_el_docente: AMARILLO
  fuente: maestro#12-errores-y-semaforo
  fuente_calibracion: calibracion#9-semaforo

- codigo: ROJO
  significado: Carencia estructural o academica que exige reconduccion
  accion: Revisión docente y plan de corrección
  calibrado: >-
    Carencia critica o bloqueo académico. Falta desarrollo, incumple una
    condicion esencial o contiene una incoherencia que afecta al nucleo.
  fuente: maestro#12-errores-y-semaforo
  fuente_calibracion: calibracion#9-semaforo

- codigo: GRIS
  significado: No evaluable por falta, fuera de plazo, archivo ilegible o criterio bloqueado
  accion: Resolver incidencia; no emitir juicio académico automático
  calibrado: >-
    No evaluable o incidencia: archivo ausente, fuera de plazo, ilegible,
    fragmentado cuando impide revisar, o criterio bloqueado por falta de
    informacion.
  fuente: maestro#12-errores-y-semaforo
  fuente_calibracion: calibracion#9-semaforo

# El color resume el estado y no lo sustituye. Un trabajo puede estar verde en
# formato y ambar en rigor cuantitativo: la lectura por dimensiones se conserva
# y una apariencia impecable no debe arrastrar toda la valoración.
# Fuente: calibracion#9-semaforo
